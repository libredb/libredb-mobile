name: Update goldens (temp)

# TEMPORARY, deleted in the same pull request that commits the regenerated images.
# Regenerates the onboarding CI goldens on the CI runner (the only place they may be drawn —
# docs/testing-architecture.md) and uploads them, so the drifted screen-6 images can be downloaded,
# inspected and committed. Runs on push to this branch alone, so it needs no default-branch entry.
on:
  push:
    branches:
      - fix/onboarding-golden-6-ci

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate onboarding CI goldens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate the onboarding CI goldens
        run: flutter test test/features/onboarding/presentation/pages/onboarding_page_golden_test.dart --update-goldens

      - name: Show which goldens changed
        run: git status --porcelain -- '**/goldens/ci/*.png' || true

      - name: Upload the regenerated goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onboarding-ci-goldens
          path: test/features/onboarding/presentation/pages/goldens/ci/*.png
          if-no-files-found: error
