# TEMPORARY. Added to draw the twelve onboarding goldens of the six-screen deck, because this
# repository's goldens are rasterized by the CI runner and a developer machine draws them differently
# (see the regeneration note in docs/testing-architecture.md). Deleted in the same commit that lands the
# images it produced — if you are reading this on a branch, that commit has not happened yet.
name: Regenerate goldens (temporary)

on: push

permissions:
  contents: read

jobs:
  goldens:
    name: Draw the onboarding goldens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Only this file. A broad --update-goldens would redraw every golden in the repository and hide a real
      # pixel change somewhere else inside a commit that claims to be about one screen.
      - name: Draw them
        run: flutter test test/features/onboarding/presentation/pages/onboarding_page_golden_test.dart --update-goldens

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goldens
          path: test/features/onboarding/presentation/pages/goldens/ci/*.png
          if-no-files-found: error
