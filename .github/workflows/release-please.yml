name: Release Please

# Keeps a release pull request open that bumps pubspec.yaml (the version name and the build number) and writes
# CHANGELOG.md from the Conventional Commits on main (docs/release.md). Merging it tags the release, and that tag is
# all this workflow does: release.yml runs on `push: tags`, and the tag is pushed with RELEASE_PLEASE_TOKEN, a user
# token, whose pushes do start other workflows. Calling release.yml from here as well would build and sign the same
# version twice (docs/release.md, "One tag, one release run").
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request opened with GITHUB_TOKEN starts no workflow of its own, so every release pull request sat
          # at "action_required" until a human pressed Approve — six times on 2026-10-30 alone. Opened under a
          # fine-grained token of the repository's owner instead, the pull request is an ordinary one and CI runs by
          # itself. The token carries Contents and Pull requests write on this repository only, and nothing else.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

