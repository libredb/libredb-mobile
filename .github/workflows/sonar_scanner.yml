name: SonarCloud

on:
  push:
    branches:
      - sonar
  pull_request:
    branches:
      - sonar
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: "sonar-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, which SonarCloud reads for blame, but no GITHUB_TOKEN left in .git/config: the scan
          # authenticates with SONAR_TOKEN and nothing here pushes.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
