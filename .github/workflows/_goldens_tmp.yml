# Temporary: regenerates the golden baselines on the runner that verifies them, because this repository's
# maintainer machine rasterises them differently. Deleted in the same PR, before review.
name: Regenerate goldens (temporary, #357)

on: push

permissions:
  contents: read

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - run: flutter test --tags golden --update-goldens || true
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: '**/goldens/ci/*.png'
