name: Release

# Builds a signed Android App Bundle for one deployment and puts it on the Play internal testing track
# (docs/release.md).
# A version tag pushed by hand, or a release-please release (release-please.yml calls this workflow), builds and
# uploads without waiting for anyone: the refs/tags/v* ruleset refuses a tag from anything but an organization admin,
# so nothing else reaches the upload key (docs/release.md). A manual run is a dry run: it signs and never uploads.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to release, such as v1.2.3'
        required: true
        type: string

permissions:
  contents: read

# A hand-pushed tag and the release-please release of the same tag share one group.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Empty on a dry run from a branch.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  RELEASE_REF: ${{ inputs.tag || github.ref }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      # The build job builds exactly this commit. A release must be a commit on main, so a tag on another branch's
      # commit never reaches the signing key.
      - name: Resolve the commit
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          if [ -n "$RELEASE_TAG" ] && ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "The tag $RELEASE_TAG points at $sha, which is not on main."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check the tag against pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*$/\1/p' pubspec.yaml)
          if [ -z "$RELEASE_TAG" ]; then
            echo "Dry run of version $version: no tag to check."
          elif [ "$RELEASE_TAG" != "v$version" ]; then
            echo "The tag $RELEASE_TAG does not match version $version in pubspec.yaml."
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Check generated localizations
        run: |
          flutter test test/architecture/arb_translations_test.dart
          DART=dart scripts/generate_l10n.sh
          if [ -n "$(git status --porcelain -- lib/generated)" ]; then
            git status --porcelain -- lib/generated
            echo "lib/generated differs from the ARB files. Run scripts/generate_l10n.sh and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: dart format . --line-length=120 --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        # The suite reported "All tests passed!" at 14:58 on the v1.0.2 release and the step was killed two seconds
        # later, so the release failed on the clock rather than on a test. CI's own test step already allows 30.
        timeout-minutes: 30
        run: flutter test --coverage --concurrency=4 --reporter=compact

      - name: Check coverage threshold
        run: scripts/check_coverage.sh coverage/lcov.info 65

      # The Kotlin scrubber of native Sentry events and breadcrumbs. The config-only build writes the Gradle wrapper.
      - name: Run Android unit tests
        run: |
          flutter build apk --config-only --target lib/main/main_prod.dart
          cd android
          ./gradlew :app:testDebugUnitTest -Ptarget=lib/main/main_prod.dart --console=plain

  build:
    name: Build signed App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    # The upload key's secrets live in release-signing, which only main and v*.*.* tags may use, and a v* tag comes
    # only from an organization admin; a dry run signs with the throwaway key of release-dry-run (docs/release.md).
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release-dry-run' || 'release-signing' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      # One deployment's values (docs/studio.md, docs/oidc.md, docs/security.md, docs/crash-reporting.md), written to a
      # file in the runner's temp directory so no value appears on a command line. An empty value is left out.
      # PLATFORM_API_URL and PLATFORM_CERT_PINS are optional and read from variables only, never from secrets: while
      # they are unset the build stays Studio-only (docs/platform.md). A variable of the job's environment overrides the
      # repository's, so the owner can try Platform mode on release-dry-run alone first (docs/release.md).
      - name: Write the deployment's dart-defines
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          OIDC_SCOPE: ${{ vars.OIDC_SCOPE }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
          OIDC_PROMPT: ${{ vars.OIDC_PROMPT }}
          OIDC_AUTO_REDIRECT: ${{ vars.OIDC_AUTO_REDIRECT }}
          OIDC_LOGOUT_HINT: ${{ vars.OIDC_LOGOUT_HINT }}
          STUDIO_CERT_PINS: ${{ vars.STUDIO_CERT_PINS }}
          OIDC_CERT_PINS: ${{ vars.OIDC_CERT_PINS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
          SENTRY_DIST: ${{ vars.SENTRY_DIST }}
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          PLATFORM_CERT_PINS: ${{ vars.PLATFORM_CERT_PINS }}
        run: |
          for name in PROD_API_URL OIDC_ISSUER OIDC_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "The repository variable $name is not set (docs/release.md)."
              exit 1
            fi
          done
          jq -n 'env | with_entries(select(.value != "" and (.key | IN(
            "PROD_API_URL", "OIDC_ISSUER", "OIDC_CLIENT_ID", "OIDC_SCOPE", "OIDC_AUDIENCE", "OIDC_PROMPT",
            "OIDC_AUTO_REDIRECT", "OIDC_LOGOUT_HINT", "STUDIO_CERT_PINS", "OIDC_CERT_PINS", "SENTRY_DSN",
            "SENTRY_ENVIRONMENT", "SENTRY_DIST", "PLATFORM_API_URL", "PLATFORM_CERT_PINS"))))' \
            > "$RUNNER_TEMP/dart-defines.json"
          echo "Defines set: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/dart-defines.json")"

      # A define meant for checks only, such as SENTRY_DEVICE_CHECK, never reaches a store build.
      - name: Refuse check-only defines
        env:
          RELEASE_VARS: ${{ toJSON(vars) }}
        run: tool/release/check_defines.sh "$RUNNER_TEMP/dart-defines.json"

      # A release uploads its Dart symbols and R8 mapping to Sentry and stops here without the token; a dry run never
      # uploads (docs/release.md, "Crash symbols").
      - name: Check the Sentry upload
        id: sentry
        env:
          RELEASE_KIND: ${{ github.event_name == 'workflow_dispatch' && 'dry-run' || 'release' }}
          # Only whether the secret is set, never its value.
          SENTRY_TOKEN_SET: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: tool/release/check_sentry_upload.sh

      # The id the native SDK reports with each event, and the id the R8 mapping is uploaded under, so Sentry can match
      # the two.
      - name: Name the R8 mapping
        run: echo "SENTRY_PROGUARD_UUID=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_ENV"

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The secret ANDROID_UPLOAD_KEYSTORE_BASE64 is not set (docs/release.md)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build App Bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        # Obfuscated, with the Dart symbols and the obfuscation map in build/debug-info, outside the bundle.
        run: >-
          flutter build appbundle --release --target lib/main/main_prod.dart
          --dart-define-from-file="$RUNNER_TEMP/dart-defines.json" -PrequireReleaseSigning=true
          --obfuscate --split-debug-info=build/debug-info
          --extra-gen-snapshot-options=--save-obfuscation-map=build/debug-info/obfuscation.map.json
          -PsentryProguardUuid="$SENTRY_PROGUARD_UUID"

      # Compares the signing certificate with the fingerprint of the environment's key; the log names neither the
      # certificate's owner nor its fingerprint.
      - name: Check the bundle's signature
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          bundle=build/app/outputs/bundle/release/app-release.aab
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "The variable ANDROID_UPLOAD_CERT_SHA256 is not set (docs/release.md)."
            exit 1
          fi
          if ! jarsigner -verify "$bundle" | grep -q '^jar verified'; then
            echo "The bundle has no valid signature."
            exit 1
          fi
          normalize() { tr -d ': \n' | tr '[:lower:]' '[:upper:]'; }
          actual=$(keytool -printcert -jarfile "$bundle" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 |
            normalize)
          if [ -z "$actual" ] || [ "$actual" != "$(printf '%s' "$EXPECTED_SHA256" | normalize)" ]; then
            echo "The bundle is not signed with the key that ANDROID_UPLOAD_CERT_SHA256 names."
            exit 1
          fi
          echo "The bundle is signed with the expected upload key."

      # The keystore is no longer needed, so no later step, such as the Sentry upload, runs while it is on disk.
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      # The sentry-cli the upload runs, checked against the hash written here: sentry_dart_plugin only logs a binary
      # whose checksum does not match. 2.58.6 is the version sentry_dart_plugin 3.4.0 pins; change both together.
      - name: Fetch sentry-cli
        if: steps.sentry.outputs.upload == 'true'
        run: |
          cli="$RUNNER_TEMP/sentry-cli"
          curl --fail --silent --show-error --location --output "$cli" \
            https://downloads.sentry-cdn.com/sentry-cli/2.58.6/sentry-cli-Linux-x86_64
          echo "36b689311b399d9332950d84f4299aee682d2d290a770a77372b30a74f7e7add  $cli" | sha256sum --check --strict
          chmod +x "$cli"
          echo "SENTRY_CLI=$cli" >> "$GITHUB_ENV"

      # sentry_dart_plugin creates the release and uploads the Dart symbols; tool/release/upload_dart_symbol_map.sh
      # uploads the obfuscation map and upload-proguard the R8 mapping, which the plugin would only log on failure or
      # not upload at all. All three use the sentry-cli checked above. The settings come from this environment only: the
      # repository holds no sentry.properties and no sentry section in pubspec.yaml. A failed upload stops the release
      # before the bundle is kept.
      - name: Upload the symbols to Sentry
        if: steps.sentry.outputs.upload == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: libredb-org
          SENTRY_PROJECT: libredb-mobile
        run: |
          # The release the app reports: version name and build number of pubspec.yaml (AppBootstrap, NativeSentry).
          SENTRY_RELEASE=$(sed -n 's/^version: *\([^ ]*\).*$/\1/p' pubspec.yaml)
          export SENTRY_RELEASE
          echo "Uploading the symbols of release $SENTRY_RELEASE to Sentry."
          dart run sentry_dart_plugin --sentry-define=bin_path="$SENTRY_CLI" \
            --sentry-define=symbols_path=build/debug-info --sentry-define=commits=false
          tool/release/upload_dart_symbol_map.sh "$SENTRY_CLI" build/debug-info/obfuscation.map.json build/debug-info
          "$SENTRY_CLI" upload-proguard --require-one \
            --uuid "$SENTRY_PROGUARD_UUID" build/app/outputs/mapping/release/mapping.txt

      - name: Keep the bundle and the R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          # The bundle carries the deployment's URLs and the Sentry DSN compiled in.
          retention-days: 7

      - name: Delete the keystore and the defines
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/dart-defines.json"

  upload:
    name: Upload to Play internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Never on a dry run; play-internal holds the Play service account and takes only main and v*.*.* tags.
    if: github.event_name != 'workflow_dispatch' && (inputs.tag || github.ref_type == 'tag')
    environment: play-internal
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle

      - name: Upload to Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.libredb.mobile
          releaseFiles: release-bundle/bundle/release/app-release.aab
          track: internal
          # Unset today, so a release reaches the testers on its own; set it to draft to park one in the console.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          mappingFile: release-bundle/mapping/release/mapping.txt
