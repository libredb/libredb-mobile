name: Release

# Builds a signed Android App Bundle for one deployment and puts it on the Play internal testing track
# (docs/release.md).
# A version tag pushed by hand, or a release-please release (release-please.yml calls this workflow), builds and then
# waits for the user's approval of the play-internal environment before the upload. A manual run is a dry run: it
# builds and signs the bundle and never uploads.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to release, such as v1.2.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "release-${{ inputs.tag || github.ref }}"
  cancel-in-progress: false

env:
  # Empty on a dry run from a branch.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  RELEASE_REF: ${{ inputs.tag || github.ref }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Check the tag against pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*$/\1/p' pubspec.yaml)
          if [ -z "$RELEASE_TAG" ]; then
            echo "Dry run of version $version: no tag to check."
          elif [ "$RELEASE_TAG" != "v$version" ]; then
            echo "The tag $RELEASE_TAG does not match version $version in pubspec.yaml."
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Check generated localizations
        run: |
          flutter test test/architecture/arb_translations_test.dart
          DART=dart scripts/generate_l10n.sh
          if [ -n "$(git status --porcelain -- lib/generated)" ]; then
            git status --porcelain -- lib/generated
            echo "lib/generated differs from the ARB files. Run scripts/generate_l10n.sh and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: dart format . --line-length=120 --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        timeout-minutes: 15
        run: flutter test --coverage --concurrency=4 --reporter=compact

      - name: Check coverage threshold
        run: scripts/check_coverage.sh coverage/lcov.info 65

      # The Kotlin scrubber of native Sentry events and breadcrumbs. The config-only build writes the Gradle wrapper.
      - name: Run Android unit tests
        run: |
          flutter build apk --config-only --target lib/main/main_prod.dart
          cd android
          ./gradlew :app:testDebugUnitTest -Ptarget=lib/main/main_prod.dart --console=plain

  build:
    name: Build signed App Bundle
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      # One deployment's values (docs/studio.md, docs/oidc.md, docs/security.md, docs/crash-reporting.md), written to a
      # file in the runner's temp directory so no value appears on a command line. An empty value is left out.
      - name: Write the deployment's dart-defines
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          OIDC_SCOPE: ${{ vars.OIDC_SCOPE }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
          OIDC_PROMPT: ${{ vars.OIDC_PROMPT }}
          OIDC_AUTO_REDIRECT: ${{ vars.OIDC_AUTO_REDIRECT }}
          OIDC_LOGOUT_HINT: ${{ vars.OIDC_LOGOUT_HINT }}
          STUDIO_CERT_PINS: ${{ vars.STUDIO_CERT_PINS }}
          OIDC_CERT_PINS: ${{ vars.OIDC_CERT_PINS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
          SENTRY_DIST: ${{ vars.SENTRY_DIST }}
        run: |
          for name in PROD_API_URL OIDC_ISSUER OIDC_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "The repository variable $name is not set (docs/release.md)."
              exit 1
            fi
          done
          jq -n 'env | with_entries(select(.value != "" and (.key | IN(
            "PROD_API_URL", "OIDC_ISSUER", "OIDC_CLIENT_ID", "OIDC_SCOPE", "OIDC_AUDIENCE", "OIDC_PROMPT",
            "OIDC_AUTO_REDIRECT", "OIDC_LOGOUT_HINT", "STUDIO_CERT_PINS", "OIDC_CERT_PINS", "SENTRY_DSN",
            "SENTRY_ENVIRONMENT", "SENTRY_DIST"))))' \
            > "$RUNNER_TEMP/dart-defines.json"
          echo "Defines set: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/dart-defines.json")"

      # A define meant for checks only, such as SENTRY_DEVICE_CHECK, never reaches a store build.
      - name: Refuse check-only defines
        env:
          RELEASE_VARS: ${{ toJSON(vars) }}
        run: tool/release/check_defines.sh "$RUNNER_TEMP/dart-defines.json"

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The secret ANDROID_UPLOAD_KEYSTORE_BASE64 is not set (docs/release.md)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build App Bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release --target lib/main/main_prod.dart
          --dart-define-from-file="$RUNNER_TEMP/dart-defines.json" -PrequireReleaseSigning=true

      - name: Check the bundle's signature
        run: |
          bundle=build/app/outputs/bundle/release/app-release.aab
          if ! jarsigner -verify "$bundle" | grep -q '^jar verified'; then
            echo "The bundle has no valid signature."
            exit 1
          fi
          signer=$(keytool -printcert -jarfile "$bundle" | grep -m1 'Owner:')
          echo "Signed by $signer"
          if echo "$signer" | grep -q 'CN=Android Debug'; then
            echo "The bundle is signed with the debug key."
            exit 1
          fi

      - name: Keep the bundle and the R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Delete the keystore and the defines
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/dart-defines.json"

  upload:
    name: Upload to Play internal testing
    runs-on: ubuntu-latest
    needs: build
    # Never on a dry run; the play-internal environment's required reviewer approves each upload.
    if: github.event_name != 'workflow_dispatch' && (inputs.tag || github.ref_type == 'tag')
    environment: play-internal
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle

      - name: Upload to Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.libredb.mobile
          releaseFiles: release-bundle/bundle/release/app-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          mappingFile: release-bundle/mapping/release/mapping.txt
