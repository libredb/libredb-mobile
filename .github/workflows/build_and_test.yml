name: CI

on:
  push:
    branches:
      - main
      - dev
      - feature/*
      - bugfix/*
      - hotfix/*
      - release/v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check generated localizations
        # lib/generated must be exactly what scripts/generate_l10n.sh writes from the ARB files, and no ARB file under
        # lib/l10n may hold a key twice, since the generator keeps the last copy without a diff.
        run: |
          flutter test test/architecture/arb_translations_test.dart
          DART=dart scripts/generate_l10n.sh
          if [ -n "$(git status --porcelain -- lib/generated)" ]; then
            git status --porcelain -- lib/generated
            echo "lib/generated differs from the ARB files. Run scripts/generate_l10n.sh and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: dart format . --line-length=120 --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        timeout-minutes: 30
        run: flutter test --coverage --concurrency=4 --reporter=compact

      - name: Check coverage threshold
        # Excludes generated/bootstrap code from the metric (see scripts/check_coverage.sh, issue #149).
        run: scripts/check_coverage.sh coverage/lcov.info 65

  build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target lib/main/main_prod.dart

      # The Kotlin scrubber of native Sentry events and breadcrumbs (android/app/src/test). The APK build above wrote
      # the Gradle wrapper.
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -Ptarget=lib/main/main_prod.dart --console=plain

      - name: Build App Bundle
        run: flutter build appbundle --release --target lib/main/main_prod.dart
