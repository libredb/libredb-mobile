name: libredb_mobile
description: "LibreDB Mobile, the Android and iOS client of LibreDB Studio"
publish_to: 'none'
version: 1.0.0+1

# fvm flutter --version
# Flutter 3.47.7 • channel stable • https://github.com/flutter/flutter.git
# Framework • revision abaf9c5237 (12 days ago) • 2026-10-08 09:51:21 -0700
# Engine • hash d8a2d6c768c334d53e16277f837970ffa1e2de81 (revision deb287481e) (12 days ago) • 2026-10-07 17:09:12.000Z
# Tools • Dart 3.13.5 • DevTools 2.60.0
environment:
  sdk: ^3.13.5
  flutter: '3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: 9.1.1
  go_router: 18.1.1
  equatable: 3.0.0
  intl: 0.20.3
  flutter_form_builder: 10.3.0+2 # pinned: 11.x builds on material_ui and needs the app-wide material_ui migration
  form_builder_validators: 11.3.0
  bloc_concurrency: 0.3.0
  clock: 1.1.3
  stream_transform: 2.1.2
  shared_preferences: 2.5.6
  logger: 2.8.0
  dio: 5.11.1
  shimmer: 4.0.0
  url_launcher: 6.3.3
  package_info_plus: 10.2.2
  connectivity_plus: 7.3.2
  flutter_secure_storage: 11.2.0
  crypto: 3.0.7
  uuid: 4.6.0
  screen_protector: 1.5.3
  sentry_flutter: 10.1.0
  oidc: 5.0.2
  http: 1.6.0
  share_plus: 13.3.1
  cryptography: 2.9.0
  path_provider: 2.1.6
  local_auth: 3.0.2
  local_auth_android: 2.3.0 # its AndroidAuthMessages localizes the system prompt; the version local_auth 3.0.2 resolves
  local_auth_darwin: 2.0.5 # its IOSAuthMessages localizes the system prompt; the version local_auth 3.0.2 resolves

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  bloc_test: 10.0.0
  mocktail: 1.0.5
  fake_async: 1.3.3
  shared_preferences_platform_interface: 2.4.2
  alchemist: 0.14.1
  intl_utils: 2.8.17 # discontinued upstream; still works on Dart 3.13; Flutter's gen-l10n is the replacement
  logging: 1.3.0
  sentry: 10.1.0 # the version sentry_flutter pins; tests build options with an Android platform from its src
  yaml: 3.1.4 # reads the release workflows in test/architecture/android_release_setup_test.dart
  sentry_dart_plugin: 3.4.0 # creates the Sentry release and uploads the Dart symbols of a release build (docs/release.md)

flutter_intl:
  enabled: true
  template-arb-file: lib/l10n/intl_en.arb
  output-localization-file: l10n.dart
  output-class: S

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # The faces libredb.org is set in, so the app and the site read as one product. Both SIL OFL-1.1; the licence
    # ships beside them in assets/fonts/OFL.txt. Only the weights AppTypography asks for are bundled — a weight that
    # is not here is synthesised by the engine, which passes for the real face until the two are seen side by side.
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    # Code surfaces only, and only one weight: no code surface in this app sets a weight.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400

  assets:
    - assets/mock/
    - assets/fonts/OFL.txt
    - assets/adoption.json
    - NOTICE
